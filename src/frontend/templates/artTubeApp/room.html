<html>
    <head>
        <title>ArtTube - Gallery</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Workbench&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <style>
            #carouselExampleAutoplaying .carousel-control-prev-icon,
            #carouselExampleAutoplaying .carousel-control-next-icon {
                filter: invert(1);
            }
        </style>
    </head>
    <body>
        <div class="mx-auto p-2" style="width: 200px; font-family: Workbench, sans-serif;">
            <h1 style="font-size: 3rem;">ArtTube</h1>
        </div>
        {% include 'artTubeApp/navbar.html' %}
        <hr>
        <p class="text-center" style="font-family: Workbench, sans-serif; font-size: 2rem;">Welcome!</p>
        <div class="container d-flex justify-content-center align-items-center" style="width: 200px; font-family: Workbench, sans-serif;">
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Exit Room</button>
            </form>
        </div>
        <p class="text-center" style="font-family: Workbench, sans-serif; font-size: 1rem;">Current Occupancy:  {{occupancy}}/100</p>

        <!-- grid -->
        <div class="container text-center">
            <h2 style="font-family: Workbench, sans-serif; font-size: 2rem; margin-top: 2rem;">Collection</h2>
            <div class="row g-3">
                {% for s in submissions %}
                    <div class="col-3">
                        <div class="card" style="width: 15rem; height: 20rem;">
                            <img src="data:image/*; base64,{{ s.img_b64 }}" alt="{{ s.img_title }}" style="padding: 0.5em; border: 0.25rem solid rgb(113, 84, 50); width: 15rem; height: 12rem; object-fit: contain; background-color: rgb(241, 240, 240);">
                            
                            <div class="card-body">
                                <p class="card-text">
                                    <dl>
                                        <dt>{{s.img_title}}</dt>
                                        <dd>{{s.img_desc}}</dd>
                                    </dl>
                                </p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>  
        </div>
        
    </body>
</html>
