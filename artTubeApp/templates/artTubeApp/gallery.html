<html>
    <head>
        <title>ArtTube - Gallery</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <style>
            #carouselExampleAutoplaying .carousel-control-prev-icon,
            #carouselExampleAutoplaying .carousel-control-next-icon {
                filter: invert(1);
            }
        </style>
    </head>
    <body>
        <h1>ArtTube</h1>
        <br />
        <p>Welcome to the Gallery!</p>
        <!-- carousel -->
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                <h2 class="container text-center">Featured</h2>
                <div class="carousel-inner w-75 mx-auto">
                    <div class="carousel-item active bg-body-secondary">
                        <img src="https://images.freecreatives.com/wp-content/uploads/2015/03/Street-Modern-painting.jpg" class="object-fit-cover border rounded d-block w-100 h-50" alt="...">
                    </div>
                    <div class="carousel-item bg-body-secondary">
                        <img src="https://wallpapers.com/images/hd/traditional-japanese-art-4mgc1cwo3hl8hdbo.jpg" class="object-fit-cover border rounded d-block w-100 h-50" alt="...">
                    </div>
                    <div class="carousel-item bg-body-secondary">
                        <img src="https://i.pinimg.com/originals/65/4d/10/654d10cd803dcdc4469f6fccd236b8c9.jpg" class="object-fit-contain border rounded d-block w-100 h-50" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

        <!-- grid -->
        <div class="container text-center">
            <h2>Collection</h2>
            <div class="row g-3">
                {% for s in submissions %}
                    <div class="col-3">
                        <div class="card" style="width: 15rem; height: 20rem;">
                            <img src="{{ s.img }}" class="card-img-top" alt="Image unavailable" style="padding: 0.5em; border: 0.25rem solid rgb(113, 84, 50); width: 15rem; height: 12rem; object-fit: contain; background-color: rgb(241, 240, 240);">
                            
                            <div class="card-body">
                                <p class="card-text">
                                    <dl>
                                        <dt>{{s.img_title}}</dt>
                                        <dd>{{s.img_desc}}</dd>
                                    </dl>
                                </p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>  
        </div>
        
    </body>
</html>
