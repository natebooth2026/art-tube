<html>
    <head>
        <title>ArtTube Canvas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Workbench&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="mx-auto p-2" style="width: 200px; font-family: Workbench, sans-serif;">
            <h1 style="font-size: 3rem;">ArtTube</h1>
        </div>
        {% include 'artTubeApp/navbar.html' %}
        <hr>
        <h1>ArtTube Canvas</h1>
        <a href="{% url 'studio' %}"><button>Go Back</button></a>
        <br /> <br />
        <h3>New Submission Request</h3>
        
        <form method="post">
            <div id="req_form" style="display: inline-block">
                {% csrf_token %}
                {{ r_form.as_p }}
            </div>
            <div id="verify_form" style="display: inline-block">
                <h4>To submit, validate</h4>
                {{ v_form.as_p }}
            </div>
            <br />
            <button type="submit">Submit Request</button>
        </form>
    </body>
</html>
