<html>
    <head>
        <title>ArtTube - Employee</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Workbench&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="mx-auto p-2" style="width: 200px; font-family: Workbench, sans-serif;">
            <h1 style="font-size: 3rem;">ArtTube</h1>
        </div>
        {% include 'artTubeApp/navbar.html' %}
        <hr>
        <p class="text-center" style="font-family: Workbench, sans-serif; font-size: 2rem;">Employee Dashboard</p>
         <div class="content text-center" >
            <h2>Manage Requests</h2>
            <p>Select a request to review.</p>
            <table class="table table-bordered w-75 mx-auto">
                <thead>
                    <th scope="col">ID</th>
                    <th scope="col">Preview</th>
                    <th scope="col">Title</th>
                    <th scope="col">Intended Category</th>
                </thead>
                {% for r in reqs %}
                <tbody>
                        <td> <a href="{% url 'emp_req_view' r.id %}">{{ r.id }}</a> </td>
                        <td> <img src="{{r.img}}" alt="{{ r.img_title }}" style="max-width: 100px;"> </td>
                        <td> {{ r.img_title }} </td>
                        <td> {{ r.img_category }} </td>
                </tbody>
                {% endfor %}
            </table>
        </div>
    </body>
</html>
